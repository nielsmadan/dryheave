[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dryheave"
version = "0.1.0"
description = "Frozen inputs and retained evidence for interactive coding-agent benchmarks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psutil==7.2.2",
    "pydantic>=2.11,<3",
]
license = "MIT"
authors = [{ name = "Niels Madan" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
dryheave = "dryheave.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5",
    "ruff>=0.16.1",
    "pylint>=4.0.7",
    "mypy>=2.3.0",
    "types-psutil>=7.2.2.20260906",
]

[tool.coverage.run]
source = ["dryheave"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "BLE", "S", "SLF", "RUF"]
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.pylint]
max-returns = 8
max-branches = 15
max-statements = 60
max-args = 6

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402"]
"tests/*" = ["S101", "SLF001", "S108", "E702", "E402", "PLC0415", "PLW1510", "PLR2004"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["cyclic-import"]

[tool.pylint.reports]
score = false

[tool.mypy]
python_version = "3.13"
files = ["src/dryheave"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest -m 'not packaging'"
markers = ["packaging: asserts against a wheel that `just build` has already produced"]

[tool.hatch.build.targets.wheel]
packages = ["src/dryheave"]

[tool.hatch.build.targets.sdist]
include = ["src/dryheave", "tests", "docs/user", "docs/tech", "docs/decisions", "docs/tests", "README.md", "LICENSE", "AGENTS.md", "CLAUDE.md", "Justfile", "lefthook.yml", "uv.lock"]
